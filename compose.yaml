services:
  inngest:
    image: inngest/inngest:latest
    command:
      inngest dev -u http://host.containers.internal:3000/api/inngest
      --no-discovery --port 8288
    ports:
      - "8288"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bp
      POSTGRES_PASSWORD: bp
      POSTGRES_DB: contracts
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bp -d contracts"]
      interval: 2s
      timeout: 3s
      retries: 15
