<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contract Features Chat</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      deep-chat {
        display: block;
        height: 100%;
      }
    </style>
    <script type="module" src="/deep-chat/deepChat.bundle.js"></script>
  </head>
  <body>
    <deep-chat id="chat"></deep-chat>
    <script type="module">
      const chat = document.getElementById("chat");
      chat.directConnection = {
        ollama: {
          // The browser posts to Ollama directly; no proxy is involved.
          url: "http://localhost:11434/api/chat",
          model: "llama3.2:latest",
          // Keep the whole conversation in the request body.
          maxMessages: -1,
          // The component defaults this to false, which makes Ollama send one
          // complete object instead of NDJSON, so the reply renders all at
          // once. Set it explicitly or replies stop appearing token by token.
          stream: true,
        },
      };
      chat.introMessage = { text: "Ask me anything. I am running locally on Ollama." };
    </script>
  </body>
</html>
